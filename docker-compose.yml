version: "3.8"

services:
  # ========== 注册中心 & 配置中心 ==========
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
      - JVM_XMS=256m
      - JVM_XMX=512m
    volumes:
      - ./data/nacos/logs:/home/nacos/logs
    networks:
      - micro-network

  # ========== 消息队列 ==========
  rocketmq-namesrv:
    image: apache/rocketmq:5.2.0
    container_name: rmq-namesrv
    ports:
      - "9876:9876"
    environment:
      - JAVA_OPT_EXT=-server -Xms256m -Xmx256m
    command: sh mqnamesrv
    volumes:
      - ./data/rocketmq/namesrv/logs:/home/rocketmq/logs
    networks:
      - micro-network

  rocketmq-broker:
    image: apache/rocketmq:5.2.0
    container_name: rmq-broker
    ports:
      - "10911:10911"
      - "10909:10909"
      - "10912:10912"
    environment:
      - JAVA_OPT_EXT=-server -Xms256m -Xmx512m
      - NAMESRV_ADDR=rocketmq-namesrv:9876
    depends_on:
      - rocketmq-namesrv
    command: sh mqbroker -c /home/rocketmq/conf/broker.conf
    volumes:
      - ./data/rocketmq/broker/logs:/home/rocketmq/logs
      - ./data/rocketmq/broker/store:/home/rocketmq/store
      - ./conf/rocketmq/broker.conf:/home/rocketmq/conf/broker.conf
    networks:
      - micro-network

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: rmq-dashboard
    ports:
      - "8081:8080"
    environment:
      - JAVA_OPTS=-Drocketmq.namesrv.addr=rocketmq-namesrv:9876 -Dcom.rocketmq.sendMessageWithVIPChannel=false
    depends_on:
      - rocketmq-namesrv
    networks:
      - micro-network

  # ========== 缓存 ==========
  redis:
    image: redis:7.2
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis123 --appendonly yes
    volumes:
      - ./data/redis:/data
    networks:
      - micro-network

  # ========== 数据库 ==========
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=micro_alibaba
      - TZ=Asia/Shanghai
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./conf/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    networks:
      - micro-network

  # ========== 分布式事务 ==========
  seata-server:
    image: seataio/seata-server:2.0.0
    container_name: seata-server
    ports:
      - "8091:8091"
      - "7091:7091"
    environment:
      - SEATA_IP=seata-server
      - SEATA_PORT=8091
      - STORE_MODE=db
    volumes:
      - ./conf/seata/registry.conf:/seata-server/resources/registry.conf
      - ./conf/seata/file.conf:/seata-server/resources/file.conf
    networks:
      - micro-network

networks:
  micro-network:
    driver: bridge
